<header class="header-area transition" [ngClass]="{'active': isToggled}">
    <button type="button" class="burger-menu transition" [ngClass]="{'active': isToggled}" (click)="toggle()" aria-label="Apri o chiudi il menu">
        <i class="ri-menu-2-line"></i>
    </button>
    <div class="header-welcome">
        <small>Backoffice EasySender</small>
        <strong>Gestione operativa</strong>
    </div>
    <div class="header-date">
        <i-feather name="calendar"></i-feather>
        <span>{{ formattedDate }}</span>
    </div>
    <div class="profile-chip" [attr.title]="loginName">
        <span class="profile-avatar">{{ loginName ? loginName.charAt(0).toUpperCase() : 'A' }}</span>
        <span class="profile-copy">
            <small>Amministratore</small>
            <strong>{{ loginName || 'Account' }}</strong>
        </span>
    </div>
</header>
