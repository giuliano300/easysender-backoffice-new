<div
    class="sidebar-area bg-white transition sidebar-shadow"
    [ngClass]="{'active': isToggled}"
>
    <div class="logo bg-white">
        <a routerLink="/" class="d-flex align-items-center">
            <img src="images/logo-intro.png" alt="EasySender" class="logo-icon">
            <div class="compact-logo" aria-hidden="true">
                <img src="images/logo-mini.png" alt="">
            </div>
        </a>
    </div>
    <div class="manager-card">
        <span class="manager-avatar">{{ loginName.charAt(0).toUpperCase() }}</span>
        <span class="manager-copy">
            <small>Amministratore</small>
            <strong>{{ loginName }}</strong>
        </span>
    </div>
    <div
        class="burger-menu transition cursor-pointer"
        [ngClass]="{'active': isToggled}"
        (click)="toggle()"
    >
        <span class="top-bar transition bg-dark d-block"></span>
        <span class="middle-bar transition bg-dark d-block"></span>
        <span class="bottom-bar transition bg-dark d-block"></span>
    </div>
    <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
            <div class="sidebar-menu">
                <mat-accordion>
                    <span class="sub-title text-body">
                        PANORAMICA
                    </span>
                    <a routerLink="/dashboard" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="home"></i-feather>
                        <span class="title">
                            Dashboard
                        </span>
                    </a>
                    <a routerLink="/dashboard/sistemi" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="activity"></i-feather>
                        <span class="title">
                            Sistemi
                        </span>
                    </a>
                    <span class="sub-title text-body">
                        INVII
                    </span>
                    <a routerLink="/sends" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="send"></i-feather>
                        <span class="title">
                            Invii
                        </span>
                    </a>
                    <a routerLink="/operations" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="layers"></i-feather>
                        <span class="title">
                            Operazioni
                        </span>
                    </a>
                    <a routerLink="/sends/report" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="bar-chart-2"></i-feather>
                        <span class="title">
                            Report invii
                        </span>
                    </a>
                    <a routerLink="/sends/total-report" class="sidebar-menu-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        <i-feather name="bar-chart-2"></i-feather>
                        <span class="title">
                            Report generale
                        </span>
                    </a>
                    <span class="sub-title text-body">
                        AMMINISTRAZIONE
                    </span>
                    <mat-expansion-panel (opened)="panelOpenState = true" (closed)="panelOpenState = true">
                        <mat-expansion-panel-header (click)="openUsersMenuFromCompactSidebar()">
                            <mat-panel-title>
                                <i-feather name="users"></i-feather>
                                <span class="title">
                                    Utenti
                                </span>
                            </mat-panel-title>
                        </mat-expansion-panel-header>
                        <ul class="sidebar-sub-menu">
                            <li class="sidemenu-item">
                                <a routerLink="/users/add" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    <i-feather name="user-plus"></i-feather>
                                    Nuovo utente
                                </a>
                            </li>
                            <li class="sidemenu-item">
                                <a routerLink="/users" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    <i-feather name="list"></i-feather>
                                    Vedi gli utenti
                                </a>
                            </li>
                        </ul>
                    </mat-expansion-panel>
                    <a class="sidebar-menu-link" (click)="logout()" href="">
                        <i-feather name="Lock"></i-feather>
                        <span class="title">Logout</span>
                    </a>
                </mat-accordion>
            </div>
        </div>
    </ng-scrollbar>
</div>
