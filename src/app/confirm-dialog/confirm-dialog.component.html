<div class="compact-dialog danger-dialog">
  <button type="button" class="icon-close" aria-label="Chiudi" (click)="onCancel()"><i class="ri-close-line"></i></button>
  <div class="dialog-symbol"><i class="ri-delete-bin-6-line"></i></div>
  <span class="dialog-eyebrow">{{ data?.eyebrow || 'CONFERMA RICHIESTA' }}</span>
  <h1>{{ data?.title || 'Eliminare l’elemento?' }}</h1>
  <p>{{ data?.message || 'L’operazione rimuoverà definitivamente l’elemento selezionato e non potrà essere annullata.' }}</p>
  <mat-dialog-actions class="dialog-actions">
    <button type="button" class="secondary-button" (click)="onCancel()">Annulla</button>
    <button type="button" class="danger-button" (click)="onConfirm()"><i [class]="data?.confirmIcon || 'ri-delete-bin-line'"></i>{{ data?.confirmLabel || 'Elimina' }}</button>
  </mat-dialog-actions>
</div>
